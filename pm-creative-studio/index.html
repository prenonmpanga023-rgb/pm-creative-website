<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PM Creative Studio — Creativity Meets Technology</title>
<meta name="description" content="Professional graphic design, modern websites and digital solutions by Prenon Mpanga.">
<meta name="theme-color" content="#0a0a0a"><link rel="icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
@media(max-width:1920px){html{font-size:.833333vw}}@media(max-width:1440px){html{font-size:1.111111vw}}
@media(max-width:1024px){html{font-size:1.5625vw}}@media(max-width:640px){html{font-size:4.444444vw}}
:root{--ink:#0a0a0a;--muted:#8d8d8d;--line:#e6e5e2;--surf:#f1f0ee;--acc:#b15f2c;--a1:#cf8047;--a2:#97501f}
body{background:#fff;color:#111;font-family:Onest,sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}ul{list-style:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.shell{max-width:88rem;margin-inline:auto;padding-inline:1.25rem}@media(min-width:640px){.shell{padding-inline:2rem}}
/* motion system: one curve, one reveal */
.rv{opacity:0;transform:translateY(24px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1);transition-delay:var(--d,0ms)}
.rv.in{opacity:1;transform:none}
.lift{transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}.lift:hover{transform:translateY(-6px)}
.btn{display:inline-flex;align-items:center;gap:.75rem;border-radius:9999px;font-size:.875rem;font-weight:500;padding:.875rem 1.75rem;transition:transform .3s cubic-bezier(.2,.8,.2,1),background .3s}
.btn:hover{transform:scale(1.04)}.btn:active{transform:scale(.97)}
.dark{background:var(--ink);color:#fff}.light{background:var(--surf)}.out{border:1px solid var(--line)}
.eb{display:inline-flex;align-items:center;gap:.5rem;font-size:.875rem;font-weight:500;color:rgba(17,17,17,.7)}.eb:before{content:"";width:.375rem;height:.375rem;border-radius:9px;background:var(--acc)}
h1,h2{letter-spacing:-.02em;font-weight:600}
/* loader */
#ld{position:fixed;inset:0;z-index:120;background:#f7f6f4;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;border-radius:0 0 2rem 2rem;transition:transform .8s cubic-bezier(.22,1,.36,1)}
#ld.out{transform:translateY(-100%)}#ld b{font-size:1.75rem;font-weight:600}#ld b i{color:var(--a1);font-style:normal}
.bar{width:min(22rem,72vw);height:1px;background:rgba(17,17,17,.12)}.bar div{height:100%;width:0;background:var(--a1)}
#ld small{display:flex;justify-content:space-between;width:min(22rem,72vw);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:rgba(17,17,17,.5);margin-top:-1rem}
/* header */
header{position:absolute;inset-inline:0;top:0;z-index:50}header .shell{display:flex;align-items:center;justify-content:space-between;padding-block:1.5rem;gap:1rem}
.logo{display:flex;align-items:center;gap:.6rem;font-size:1.05rem;font-weight:600}.logo img{height:2.75rem;width:auto;transition:transform .35s cubic-bezier(.2,.8,.2,1)}.logo:hover img{transform:scale(1.08) rotate(-3deg)}.lchip{background:#fff;border-radius:1rem;padding:.5rem 1rem}.lchip img{height:3.5rem;display:block}
.mk{position:relative;width:7rem;aspect-ratio:907/1183;animation:pop .5s cubic-bezier(.34,1.56,.64,1) 1.1s both}.mk img{position:absolute;inset:0;width:100%;height:100%}.mk .lp{animation:inP 1.1s cubic-bezier(.16,1,.3,1) .1s both}.mk .lm{animation:inM 1.1s cubic-bezier(.16,1,.3,1) .1s both}#ld .lt{animation:up .7s cubic-bezier(.16,1,.3,1) .9s both}
@keyframes inP{from{transform:translate(-9rem,-3rem) rotate(-18deg);opacity:0}to{transform:none;opacity:1}}@keyframes inM{from{transform:translate(9rem,3rem) rotate(18deg);opacity:0}to{transform:none;opacity:1}}@keyframes pop{from{transform:scale(1)}50%{transform:scale(1.08)}to{transform:scale(1)}}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
nav{display:none;gap:2rem;font-size:.875rem;font-weight:500}@media(min-width:1024px){nav{display:flex}}
nav a{transition:opacity .3s,transform .3s;opacity:.8}nav a:hover{opacity:1;transform:translateY(-2px)}
.chip{border:1px solid rgba(230,229,226,.8);background:rgba(255,255,255,.4);backdrop-filter:blur(4px);border-radius:.875rem;padding:.5rem 1rem;font-size:.75rem;font-weight:500}
.tools{display:flex;gap:.5rem;align-items:center}.clk{display:none}@media(min-width:768px){.clk{display:block}}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:0 0 2rem 2rem;background:linear-gradient(160deg,#ecebe9,#c9c9c9);min-height:100svh;isolation:isolate}
.hero .wm,.foot .wm{position:absolute;inset-inline:0;bottom:6rem;text-align:center;font-size:13rem;font-weight:700;line-height:1;color:rgba(255,255,255,.45);z-index:0;pointer-events:none;white-space:nowrap}
.glow{position:absolute;width:40rem;height:40rem;border-radius:50%;background:radial-gradient(circle,rgba(207,128,71,.35),transparent 65%);right:-10rem;top:-8rem;animation:fl 9s ease-in-out infinite alternate;z-index:0}
@keyframes fl{to{transform:translate(-4rem,3rem) scale(1.1)}}
.hero .shell{position:relative;z-index:2;padding-top:9rem;padding-bottom:6rem;display:flex;flex-direction:column;gap:1.75rem}
.hero h1{font-size:2.5rem;line-height:.98;max-width:14ch}@media(min-width:768px){.hero h1{font-size:4.75rem}}
.ln{display:block;overflow:hidden}.ln span{display:block;transform:translateY(105%);transition:transform .9s cubic-bezier(.215,.61,.355,1);transition-delay:var(--d)}.on .ln span{transform:none}
.hero p.sub{max-width:34rem;font-size:1rem;color:rgba(17,17,17,.7);line-height:1.5}
.row{display:flex;flex-wrap:wrap;gap:.75rem}
/* sections */
section{padding-block:5rem}.c{text-align:center}.c .eb{margin-bottom:1rem}
h2{font-size:2.25rem}@media(min-width:640px){h2{font-size:3rem}}
.band{display:flex;flex-direction:column;gap:.75rem}@media(min-width:640px){.band{flex-direction:row}}
.band div{flex:1;display:grid;place-items:center;height:6rem;border-radius:9999px;font-size:1.875rem;font-weight:500}@media(min-width:640px){.band div{height:9rem;font-size:2.25rem}}
.cards{display:grid;gap:1.5rem;margin-top:3rem}@media(min-width:768px){.cards{grid-template-columns:1fr 1fr}}
.card{position:relative;min-height:22rem;border-radius:2rem;background:var(--ink);color:#fff;padding:2rem;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.card>:not(.cv){position:relative;z-index:1}.card .cv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.45;transition:transform .9s cubic-bezier(.16,1,.3,1)}.card:hover .cv{transform:scale(1.05)}
.card.web{grid-column:1/-1;min-height:26rem}@media(min-width:768px){.card.web .cv{left:auto;width:40%;opacity:1}.card.web>div{max-width:55%}}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;text-align:left}@media(min-width:1024px){.gal{grid-template-columns:repeat(4,1fr)}}
.gal figure{cursor:zoom-in}.gal img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:top;border-radius:1.25rem;display:block;transition:transform .5s cubic-bezier(.2,.8,.2,1)}.gal figure:hover img{transform:scale(1.03)}
.gal figcaption{margin-top:.6rem;font-size:.8rem;color:rgba(17,17,17,.6)}
.ceo{margin-bottom:1.5rem;max-width:24rem;border-radius:2rem;overflow:hidden;background:var(--ink);color:#fff}.ceo img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}.ceo figcaption{padding:1rem 1.25rem;font-size:.875rem;font-weight:500}.ceo figcaption small{display:block;color:rgba(255,255,255,.55);font-weight:400}
.zm{max-width:100%;max-height:80vh;border-radius:1rem;display:block;margin:auto}
.card small{font-size:.75rem;text-transform:uppercase;letter-spacing:.03em;color:rgba(255,255,255,.5)}
.card h3{font-size:1.875rem;font-weight:500}.card p{margin-top:.5rem;font-size:.875rem;color:rgba(255,255,255,.6);max-width:28rem}
.tg{display:inline-block;border:1px solid rgba(255,255,255,.25);border-radius:9999px;padding:.4rem .9rem;font-size:.8rem;margin:1rem .4rem 0 0}
.svc{border-top:1px solid var(--line)}.svr{display:flex;align-items:center;gap:1.5rem;padding:2rem 1rem;border-radius:1.25rem;transition:background .35s,padding .35s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.svr:hover{background:var(--surf);padding-inline:2rem 1.25rem}.svr h3{flex:1;font-size:1.5rem;font-weight:500}@media(min-width:768px){.svr h3{font-size:2rem}}
.svr .pr{font-size:.875rem;color:rgba(17,17,17,.6);text-align:right}.svr .ar{width:3rem;height:3rem;border-radius:9px;display:grid;place-items:center;background:var(--ink);color:#fff;transition:transform .3s}.svr:hover .ar{transform:translateX(5px)}
.svr .ds{display:none;max-width:20rem;font-size:.875rem;color:rgba(17,17,17,.55)}@media(min-width:1024px){.svr .ds{display:block}}
.about{display:grid;gap:3rem}@media(min-width:1024px){.about{grid-template-columns:1fr 1fr}}
.about h2{font-size:1.75rem;font-weight:500;line-height:1.35;letter-spacing:-.01em}.about h2 em{font-style:normal;color:var(--muted)}
.foot{position:relative;overflow:hidden;border-radius:2rem 2rem 0 0;background:var(--ink);color:#fff;padding-block:5rem 3rem}
.foot .wm{color:rgba(255,255,255,.05);bottom:-1.5rem}.foot .shell{position:relative;z-index:2}
.foot h2{max-width:16ch}.foot .lg{display:flex;flex-wrap:wrap;gap:2rem;margin-top:3rem;padding-top:2rem;border-top:1px solid rgba(255,255,255,.1);font-size:.875rem;color:rgba(255,255,255,.6)}
.foot .btn{background:var(--surf);color:#111;margin-top:2rem}
/* modal + forms */
.ov{position:fixed;inset:0;z-index:110;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(17,17,17,.3);backdrop-filter:blur(16px);opacity:0;transition:opacity .3s}
.ov.in{opacity:1}.pn{width:100%;max-width:32rem;max-height:92vh;overflow:auto;background:#fff;border-radius:2rem;padding:2rem;box-shadow:0 25px 60px rgba(0,0,0,.25);transform:translateY(28px);transition:transform .4s cubic-bezier(.16,1,.3,1)}.ov.in .pn{transform:none}
.pn h2{font-size:1.75rem;margin:.4rem 0 1.25rem}
label{display:block;font-size:.75rem;font-weight:500;text-transform:uppercase;letter-spacing:.03em;color:rgba(17,17,17,.5);margin-bottom:1rem}
input,select,textarea{display:block;width:100%;margin-top:.4rem;border:1px solid var(--line);background:rgba(241,240,238,.5);border-radius:.875rem;padding:.75rem 1rem;font:inherit;font-size:.875rem;text-transform:none;letter-spacing:0;color:#111;outline:none;transition:border .3s,background .3s}
input:focus,select:focus,textarea:focus{border-color:rgba(17,17,17,.35);background:#fff}textarea{resize:none}
.sw{font-size:.8rem;color:var(--muted);margin-top:1rem;text-align:center}.sw button{text-decoration:underline;color:#111}
#toast{position:fixed;left:50%;bottom:1.5rem;z-index:200;transform:translate(-50%,2rem);opacity:0;background:var(--ink);color:#fff;padding:.9rem 1.4rem;border-radius:9999px;font-size:.875rem;transition:all .4s cubic-bezier(.16,1,.3,1)}#toast.in{opacity:1;transform:translate(-50%,0)}
/* dashboards */
.dash{padding-top:7rem;min-height:100vh}.dash h1{font-size:2.5rem;margin:.5rem 0 2rem}
.st{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;margin-bottom:2rem}@media(min-width:768px){.st{grid-template-columns:repeat(4,1fr)}}
.st div{background:var(--ink);color:#fff;border-radius:1.25rem;padding:1.25rem}.st b{display:block;font-size:2rem;font-weight:600}.st span{font-size:.8rem;color:rgba(255,255,255,.55)}
.ord{border:1px solid var(--line);border-radius:1.25rem;padding:1.25rem;margin-bottom:1rem;display:grid;gap:.75rem;transition:box-shadow .3s}.ord:hover{box-shadow:0 8px 30px rgba(0,0,0,.06)}
.ord .t{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;font-weight:500}.ord small{color:var(--muted);font-size:.8rem}
.pill{display:inline-block;background:var(--surf);border-radius:9999px;padding:.3rem .8rem;font-size:.75rem;font-weight:500;text-transform:capitalize}
.pill.completed{background:var(--acc);color:#fff}
.adm{display:flex;flex-wrap:wrap;gap:.5rem;align-items:end}.adm label{margin:0;flex:1;min-width:8rem}.adm .btn{padding:.7rem 1.2rem}
.tabs{display:flex;gap:.5rem;margin-bottom:1.5rem}.tabs .btn.on{background:var(--ink);color:#fff}
.empty{padding:3rem;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:1.25rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}.ln span{transform:none}}
</style></head>
<body>
<div id="ld"><div class="mk"><img class="lp" src="images/logo-p.png" alt=""><img class="lm" src="images/logo-m.png" alt=""></div><b class="lt">PM Creative Studio</b><div class="bar"><div id="lb"></div></div><small><span>Loading</span><span id="lc">000</span></small></div>
<header><div class="shell"><a href="#/" class="logo"><img src="images/logo.png" alt="PM logo"><span>PM Creative Studio</span></a>
<nav><a href="#/">Home</a><a href="#/" data-go="works">Work</a><a href="#/" data-go="services">Services</a><a href="#/" data-go="about">Studio</a><a href="#/" data-go="contact">Contact</a></nav>
<div class="tools"><span class="chip clk" id="clk"></span><button class="chip" id="auth">Sign in</button></div></div></header>
<main id="app"></main><div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== CONFIG: paste your Supabase project values ===== */
const SUPABASE_URL='https://YOUR-PROJECT.supabase.co', SUPABASE_ANON_KEY='YOUR-ANON-PUBLIC-KEY';
/* ======================================================= */
if(SUPABASE_URL.includes('YOUR-PROJECT'))alert('Supabase not connected: set SUPABASE_URL and SUPABASE_ANON_KEY in index.html');
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=(s,r=document)=>r.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const zmw=n=>'ZMW '+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const priceLabel=s=>s.price==null||s.pricing_model==='quote'?'Request a quotation':(s.pricing_model==='from'?'From ':'')+zmw(s.price);
const STAT=['pending','under_review','quoted','approved','in_progress','completed','cancelled'];
let user=null,profile=null,services=[];
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('in');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('in'),3500)}
function reveal(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
 document.querySelectorAll('.rv:not(.in)').forEach(el=>io.observe(el))}
function modal(html){const o=document.createElement('div');o.className='ov';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');
 o.innerHTML=`<div class="pn">${html}</div>`;document.body.appendChild(o);requestAnimationFrame(()=>o.classList.add('in'));
 const close=()=>{o.classList.remove('in');setTimeout(()=>o.remove(),300)};
 o.onclick=e=>{if(e.target===o)close()};o.close=close;document.addEventListener('keydown',function k(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',k)}});return o}
/* clock */
setInterval(tick,1000);function tick(){const d=new Date(),h=d.getHours();$('#clk').textContent=`${h%12||12}:${String(d.getMinutes()).padStart(2,'0')}${h<12?'am':'pm'} • ${d.getDate()} ${d.toLocaleString('en',{month:'long'})}, ${d.getFullYear()}`}tick();
/* loader */
(()=>{const t0=performance.now(),e=t=>t<.5?4*t**3:1-(-2*t+2)**3/2;(function f(n){const p=Math.min((n-t0)/1800,1),v=Math.round(e(p)*100);
 $('#lb').style.width=v+'%';$('#lc').textContent=String(v).padStart(3,'0');if(p<1)requestAnimationFrame(f);else{$('#ld').classList.add('out');setTimeout(()=>{$('#ld').remove();document.body.classList.add('ready');$('.hero')?.classList.add('on')},800)}})(t0)})();
/* auth */
async function loadUser(){const{data}=await sb.auth.getSession();user=data.session?.user||null;profile=null;
 if(user){const r=await sb.from('profiles').select('*').eq('id',user.id).single();profile=r.data}
 $('#auth').textContent=user?(profile?.role==='admin'?'Admin':'Dashboard'):'Sign in'}
$('#auth').onclick=()=>{if(!user)return authModal();location.hash=profile?.role==='admin'?'#/admin':'#/client'};
function authModal(mode='in'){const m=modal(`<span class="eb">${mode==='in'?'Welcome back':'Create account'}</span><h2>${mode==='in'?'Sign in':'Join PM Creative Studio'}</h2>
 <form id="af">${mode==='up'?'<label>Full name<input name="n" required></label>':''}<label>Email<input name="e" type="email" required></label><label>Password<input name="p" type="password" minlength="8" required></label>
 <button class="btn dark" style="width:100%;justify-content:center">${mode==='in'?'Sign in':'Create account'}</button></form>
 <p class="sw">${mode==='in'?'New here? <button id="sw">Create an account</button>':'Have an account? <button id="sw">Sign in</button>'}</p>`);
 $('#sw',m).onclick=()=>{m.close();authModal(mode==='in'?'up':'in')};
 $('#af',m).onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),b=$('button.btn',m);b.textContent='Please wait…';
  const r=mode==='in'?await sb.auth.signInWithPassword({email:f.get('e'),password:f.get('p')}):await sb.auth.signUp({email:f.get('e'),password:f.get('p'),options:{data:{full_name:f.get('n')}}});
  if(r.error){toast(r.error.message);b.textContent='Try again';return}
  if(mode==='up'&&!r.data.session){toast('Check your email to confirm your account');m.close();return}
  m.close();await loadUser();toast('Welcome!');route()}}
/* order */
function orderModal(pre){if(!user){toast('Please sign in to place an order');return authModal()}
 const m=modal(`<span class="eb">Start a project</span><h2>Tell us what you're building.</h2><form id="of">
 <label>Service<select name="s" required>${services.map(s=>`<option value="${s.id}" ${s.id===pre?'selected':''}>${esc(s.name)} — ${priceLabel(s)}</option>`).join('')}</select></label>
 <label>Project title<input name="t" required maxlength="120"></label><label>Details<textarea name="d" rows="4" required placeholder="Describe your project, deadline and any requirements."></textarea></label>
 <div class="row" style="justify-content:space-between;align-items:center"><small style="color:var(--muted)">Price is confirmed by our server.</small><button class="btn dark">Send request ↗</button></div></form>`);
 $('#of',m).onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),b=$('button.btn',m);b.textContent='Sending…';
  const r=await sb.from('orders').insert({service_id:f.get('s'),title:f.get('t'),details:f.get('d'),user_id:user.id}).select().single();
  if(r.error){toast('Could not send: '+r.error.message);b.textContent='Send request ↗';return}
  $('.pn',m).innerHTML=`<div class="c"><h2>Request received</h2><p style="color:rgba(17,17,17,.6)">Reference <b>${esc(r.data.ref)}</b>. Track it in your dashboard; you'll also get an email when it updates.</p><br><a class="btn dark" href="#/client">Open dashboard</a></div>`;
  m.onclick=null}}
/* routing */
async function route(){window.scrollTo(0,0);const h=location.hash;
 if(h==='#/client')return clientView();if(h==='#/admin')return adminView();return home()}
addEventListener('hashchange',route);
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();if(location.hash&&location.hash!=='#/'){location.hash='#/';setTimeout(()=>$('#'+g.dataset.go)?.scrollIntoView({behavior:'smooth'}),200)}else $('#'+g.dataset.go)?.scrollIntoView({behavior:'smooth'})}
 const o=e.target.closest('[data-order]');if(o){e.preventDefault();orderModal(o.dataset.order||undefined)}});
async function home(){const r=await sb.from('services').select('*').eq('published',true).order('created_at');services=r.data||[];
 const L=(a)=>a.map((t,i)=>`<span class="ln"><span style="--d:${250+i*120}ms">${t}</span></span>`).join('');
 app.innerHTML=`<section class="hero ${document.body.classList.contains('ready')?'on':''}" id="home" style="padding:0"><div class="glow"></div><div class="wm">PM CREATIVE</div>
 <div class="shell"><span class="eb rv" style="--d:200ms">Graphic design • Web development • Digital solutions</span>
 <h1>${L(['Creativity','meets','technology.'])}</h1>
 <p class="sub rv" style="--d:600ms">Professional graphic design, modern websites, and digital solutions built to bring your ideas to life. Founded by Prenon Mpanga.</p>
 <div class="row rv" style="--d:700ms"><a class="btn dark" href="#/" data-go="works">Explore My Work ↓</a><a class="btn out" href="#/" data-go="services">View Our Services</a><a class="btn out" href="#" data-order="">Book / Order</a></div></div></section>

/* client dashboard */
const need=()=>{if(!user){app.innerHTML='<div class="shell dash"><div class="empty">Please sign in to continue.</div></div>';authModal();return true}};
async function clientView(){if(need())return;const r=await sb.from('orders').select('*').order('created_at',{ascending:false});const o=r.data||[];
 app.innerHTML=`<div class="shell dash"><span class="eb">Client dashboard</span><h1>Hello, ${esc(profile?.full_name||user.email)}</h1>
 <div class="st"><div><b>${o.length}</b><span>Total orders</span></div><div><b>${o.filter(x=>!['completed','cancelled'].includes(x.status)).length}</b><span>Active</span></div><div><b>${o.filter(x=>x.deliverable_path).length}</b><span>Ready to download</span></div><div><b>${o.filter(x=>x.status==='quoted').length}</b><span>Quotes</span></div></div>
 <div class="row" style="margin-bottom:2rem"><a class="btn dark" href="#" data-order="">New order ↗</a><button class="btn out" id="so">Sign out</button></div>
 ${o.length?o.map(x=>`<div class="ord rv"><div class="t"><span>${esc(x.title)} <small>· ${esc(x.service_name)}</small></span><span class="pill ${x.status}">${x.status.replace('_',' ')}</span></div>
 <small>${esc(x.ref)} · ${new Date(x.created_at).toLocaleDateString()} · ${x.price!=null?zmw(x.price):'Quotation pending'}</small>
 ${x.deliverable_path?`<div><button class="btn dark" data-dl="${esc(x.deliverable_path)}">Download files ↓</button></div>`:''}</div>`).join(''):'<div class="empty">No orders yet. Place your first order!</div>'}</div>`;
 $('#so').onclick=async()=>{await sb.auth.signOut();user=profile=null;$('#auth').textContent='Sign in';location.hash='#/'};reveal()}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-dl]');if(!b)return;
 const r=await sb.storage.from('deliverables').createSignedUrl(b.dataset.dl,120,{download:true});r.error?toast(r.error.message):location.href=r.data.signedUrl});
/* admin dashboard */
async function adminView(tab='orders'){if(need())return;if(profile?.role!=='admin'){app.innerHTML='<div class="shell dash"><div class="empty">Admins only.</div></div>';return}
 const [or,sv]=await Promise.all([sb.from('orders').select('*').order('created_at',{ascending:false}),sb.from('services').select('*').order('created_at')]);const o=or.data||[],s=sv.data||[];
 const rev=o.filter(x=>x.status==='completed'&&x.price).reduce((a,x)=>a+Number(x.price),0);
 app.innerHTML=`<div class="shell dash"><span class="eb">Admin dashboard</span><h1>Business overview</h1>
 <div class="st"><div><b>${o.length}</b><span>Total orders</span></div><div><b>${o.filter(x=>x.status==='pending').length}</b><span>Pending</span></div><div><b>${o.filter(x=>x.status==='in_progress').length}</b><span>In progress</span></div><div><b>${zmw(rev)}</b><span>Completed order value</span></div></div>
 <div class="tabs"><button class="btn out ${tab==='orders'?'on':''}" data-tab="orders">Orders</button><button class="btn out ${tab==='services'?'on':''}" data-tab="services">Services & prices</button><button class="btn out" id="so">Sign out</button></div>
 ${tab==='orders'?(o.length?o.map(x=>`<div class="ord" data-id="${x.id}"><div class="t"><span>${esc(x.title)} <small>· ${esc(x.service_name)} · ${esc(x.customer_email)}</small></span><span class="pill ${x.status}">${x.status.replace('_',' ')}</span></div>
 <small>${esc(x.ref)} · ${new Date(x.created_at).toLocaleString()}</small><p style="font-size:.9rem">${esc(x.details)}</p>
 <div class="adm"><label>Status<select class="f-st">${STAT.map(t=>`<option ${t===x.status?'selected':''}>${t}</option>`).join('')}</select></label><label>Price (ZMW)<input class="f-pr" type="number" min="0" step="0.01" value="${x.price??''}"></label><button class="btn dark" data-save>Save</button></div>
 <div class="adm"><label>Deliverable file<input type="file" class="f-file"></label><button class="btn out" data-up>Upload & mark completed</button></div></div>`).join(''):'<div class="empty">No orders yet.</div>')
 :`${s.map(x=>`<div class="ord" data-sid="${x.id}"><div class="adm"><label>Name<input class="s-n" value="${esc(x.name)}"></label><label>Model<select class="s-m">${['fixed','from','quote'].map(m=>`<option ${m===x.pricing_model?'selected':''} value="${m}">${{fixed:'Fixed price',from:'Starting price',quote:'Custom quotation'}[m]}</option>`).join('')}</select></label><label>Price (ZMW)<input class="s-p" type="number" min="0" step="0.01" value="${x.price??''}"></label>
 <label>Published<select class="s-b"><option value="true" ${x.published?'selected':''}>Yes</option><option value="false" ${x.published?'':'selected'}>No</option></select></label><button class="btn dark" data-ssave>Save</button></div></div>`).join('')}
 <div class="ord"><b>Add service</b><div class="adm"><label>Name<input id="nn"></label><label>Description<input id="nd"></label><button class="btn dark" id="na">Add</button></div></div>`}</div>`;
 $('#so').onclick=async()=>{await sb.auth.signOut();user=profile=null;$('#auth').textContent='Sign in';location.hash='#/'};
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>adminView(b.dataset.tab));
 document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const c=b.closest('.ord'),p=$('.f-pr',c).value;
  const r=await sb.from('orders').update({status:$('.f-st',c).value,price:p===''?null:p}).eq('id',c.dataset.id);r.error?toast(r.error.message):(toast('Saved'),adminView(tab))});
 document.querySelectorAll('[data-up]').forEach(b=>b.onclick=async()=>{const c=b.closest('.ord'),f=$('.f-file',c).files[0];if(!f)return toast('Choose a file first');
  const path=`${c.dataset.id}/${Date.now()}-${f.name.replace(/[^\w.\-]/g,'_')}`;b.textContent='Uploading…';
  const u=await sb.storage.from('deliverables').upload(path,f);if(u.error){b.textContent='Upload & mark completed';return toast(u.error.message)}
  const r=await sb.from('orders').update({deliverable_path:path,status:'completed'}).eq('id',c.dataset.id);r.error?toast(r.error.message):(toast('Uploaded — customer notified'),adminView(tab))});
 document.querySelectorAll('[data-ssave]').forEach(b=>b.onclick=async()=>{const c=b.closest('.ord'),p=$('.s-p',c).value;
  const r=await sb.from('services').update({name:$('.s-n',c).value,pricing_model:$('.s-m',c).value,price:p===''?null:p,published:$('.s-b',c).value==='true'}).eq('id',c.dataset.sid);r.error?toast(r.error.message):toast('Service updated')});
 $('#na')&&($('#na').onclick=async()=>{const n=$('#nn').value.trim();if(!n)return;const r=await sb.from('services').insert({name:n,description:$('#nd').value});r.error?toast(r.error.message):adminView('services')})}
document.addEventListener("click",e=>{const z=e.target.closest("[data-zoom]");if(z)modal(`<img class="zm" src="${z.dataset.zoom}" alt="">`)});sb.auth.onAuthStateChange(()=>{});loadUser().then(route);
</script></body></html>
